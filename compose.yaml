services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus_erp_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set. Create a local .env file from .env.example and set a strong password.}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - nexus_sql_data:/var/opt/mssql

volumes:
  nexus_sql_data:












































































































































































































































































































































































































































































